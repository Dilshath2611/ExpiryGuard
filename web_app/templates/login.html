
{% extends "base.html" %}

{% block title %}Login | ExpiryGuard{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="card auth-card shadow">

        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
                <h2 class="fw-bold text-primary">ExpiryGuard</h2>
                <p class="text-muted">Smart Expiry & Waste Tracker</p>
            </div>

            <h4 class="text-center mb-4">Welcome Back!</h4>

            <form method="POST">
                <input type="hidden"
                 name="csrf_token" 
                 value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit"
                        class="btn btn-primary w-100 py-2">
                    Login
                </button>

            </form>

            <p class="text-center mt-4 mb-0">
                Don't have an account?
                <a href="{{ url_for('register') }}">Create Account</a>
            </p>

        </div>
    </div>

</div>

{% endblock %}
